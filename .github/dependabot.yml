# Dependabot only reads this file from the default branch (main).
# The app and workflows live on XuXuClassMate.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: XuXuClassMate
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: XuXuClassMate
    schedule:
      interval: monthly
