name: CI

on:
  push:
    branches: [XuXuClassMate, main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Assert Pages artifacts
        run: |
          test -f dist/_redirects
          test -f dist/_headers
          grep -q "Content-Security-Policy" dist/_headers
          test -f functions/api/metrics.ts
          test -f dist/en/notes.html
          test -f dist/zh/notes/domestic-db-docker-qa.html
          test -f dist/en/innonestx.html
          test -f dist/zh/innonestx.html
      - run: npm run check:links
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
