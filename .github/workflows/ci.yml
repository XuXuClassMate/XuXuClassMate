name: CI

on:
  push:
    branches: [XuXuClassMate]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Assert Pages artifacts
        run: |
          test -f dist/_redirects
          test -f dist/_headers
          grep -q "Content-Security-Policy" dist/_headers
          test -f functions/api/metrics.ts
          test -f dist/en/notes.html
          test -f dist/en/innonestx.html
      - run: npm run check:links
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy:
    # Auto-deploy the built Astro site to Cloudflare Pages after verify passes.
    # Requires repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
    # Set repo variable CF_PAGES_PROJECT to your Pages project name
    # (defaults to "xuxuclassmate").
    needs: verify
    if: github.ref == 'refs/heads/XuXuClassMate' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT || 'xuxuclassmate' }}
